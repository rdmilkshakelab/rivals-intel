name: Build Rivals Intel Android apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "apps/tv/**"
      - "package.json"
      - "app.json"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/ios-build.yml"

jobs:
  mobile:
    name: Build mobile Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm install
      - run: npx expo install --check
      - run: npx expo prebuild --platform android --clean
      - name: Assemble installable mobile debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rivals-intel-android
          path: android/app/build/outputs/apk/debug/*.apk

  television:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build TV APK
        working-directory: apps/tv
        env:
          RI_API_BASE_URL: ${{ vars.RI_API_BASE_URL }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rivals-intel-android-tv
          path: apps/tv/app/build/outputs/apk/debug/*.apk
