name: Build Android apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "platforms/tv/**"
      - "app/**"
      - "src/**"
      - "package.json"
      - "app.json"
      - ".github/workflows/build-android.yml"

jobs:
  tv-apk:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build TV debug APK
        working-directory: platforms/tv
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rivals-intel-tv-debug
          path: platforms/tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  mobile-apk:
    name: Build Android mobile APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install app dependencies
        run: npm install
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build mobile debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rivals-intel-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
